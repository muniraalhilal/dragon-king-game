*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#140c2e;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Baloo Bhaijaan 2","Noto Kufi Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui button{pointer-events:auto;font-family:inherit;cursor:pointer;border:0}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,560px);max-height:94vh;overflow:auto;padding:22px 26px 24px;text-align:center;background:rgba(32,16,66,.78);border:3px solid #ffd86b;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.08);display:none;pointer-events:auto}
.panel h1{margin:0 0 6px;font-size:clamp(28px,6vw,46px);line-height:1.25;color:#ffe27a;text-shadow:0 3px 0 #c2356b,0 6px 14px rgba(0,0,0,.4)}
.panel h1 span{display:block;font-size:.62em;color:#fff;text-shadow:0 2px 0 #7b4bd6}
.panel h2{margin:0 0 14px;font-size:clamp(22px,5vw,34px);color:#ffe27a}
.panel p{margin:6px 0 14px;font-size:clamp(14px,2.6vw,18px);line-height:1.7;color:#efe6ff}
.big{font-size:clamp(18px,3.4vw,24px);font-weight:800;color:#4a1638;padding:10px 34px;border-radius:999px;background:linear-gradient(#ffe27a,#ff9d5c);box-shadow:0 5px 0 #c2356b,0 10px 18px rgba(0,0,0,.35);min-height:48px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c2356b}
.big.sm{font-size:18px;padding:6px 24px;min-height:44px}
.ghost{background:rgba(255,255,255,.14);color:#fff;font-size:16px;padding:6px 18px;border-radius:999px;min-height:44px}
.lbl{font-size:17px;color:#cdbcff;margin:10px 0 6px}
#np{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
#np button{width:54px;height:54px;border-radius:16px;font-size:24px;font-weight:800;color:#fff;background:rgba(255,255,255,.14);border:3px solid transparent}
#np button.on{background:#7b4bd6;border-color:#ffe27a;box-shadow:0 0 18px rgba(255,226,122,.6)}
#help{font-size:13.5px!important;color:#cdbcff!important;margin:14px 0 0!important;line-height:1.8!important}
#cap{position:absolute;left:50%;bottom:max(14px,2.5vh);transform:translateX(-50%);width:min(94vw,780px);padding:12px 20px 12px;background:rgba(28,14,58,.82);border:2px solid #ffd86b;border-radius:22px;display:none;pointer-events:auto}
#cap p{margin:0 0 8px;font-size:clamp(15px,2.7vw,21px);line-height:1.75;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#dots{letter-spacing:6px;color:#ffe27a;font-size:14px}
#msg{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);width:92vw;text-align:center;font-size:clamp(26px,6.4vw,58px);font-weight:800;color:#fff7c9;text-shadow:0 4px 0 #c2356b,0 0 30px rgba(255,220,120,.9),0 8px 22px rgba(0,0,0,.5);display:none}
#msg.pop{display:block;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#hint{position:absolute;left:50%;top:86px;transform:translateX(-50%);max-width:92vw;padding:6px 18px;border-radius:999px;background:rgba(28,14,58,.72);font-size:clamp(14px,2.6vw,19px);text-align:center;display:none}
#mute{position:absolute;top:10px;left:10px;width:44px;height:44px;border-radius:50%;background:rgba(28,14,58,.6);color:#ffe27a;font-size:22px;font-weight:800}
#mute.off{color:#8a7aa8;text-decoration:line-through}
.pad{position:absolute;bottom:max(16px,3vh);transform:translateX(-50%);min-width:86px;height:86px;border-radius:50%;color:#fff;font-size:19px;font-weight:800;border:4px solid rgba(255,255,255,.75)!important;box-shadow:0 6px 0 rgba(0,0,0,.3),0 0 22px rgba(255,255,255,.25);opacity:.92;padding:0 10px}
.pad:active{transform:translateX(-50%) scale(.92)}
#code{font-size:36px;font-weight:800;font-family:inherit;letter-spacing:.35em;text-indent:.35em;text-align:center;width:230px;height:64px;line-height:1;padding:0;caret-color:#ffe27a;margin-bottom:12px;border-radius:14px;border:3px solid #ffd86b;background:#1c0e3a;color:#fff;direction:ltr;pointer-events:auto;user-select:text;-webkit-user-select:text;outline:0}
#lCode{font-size:clamp(40px,9vw,60px);font-weight:800;letter-spacing:12px;color:#ffe27a;direction:ltr;line-height:1.2;text-shadow:0 3px 0 #c2356b}
#kh{position:absolute;left:12px;bottom:12px;padding:6px 14px;border-radius:14px;background:rgba(28,14,58,.66);font-size:15px;display:none;direction:rtl}
#kh b{display:inline-block;min-width:26px;padding:0 7px;margin:0 2px;border-radius:7px;background:#fff;color:#2a154f;font-weight:800;text-align:center;direction:ltr}
canvas{outline:0}
#rot{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:13px;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:999px;display:none;white-space:nowrap}
@media (orientation:portrait){#rot{display:block}}
@media (max-height:480px){#cap{padding:8px 14px}#cap p{font-size:14px;line-height:1.55;margin-bottom:4px}#hint{font-size:13px;padding:4px 14px}.pad{min-width:66px;height:66px;font-size:15px}.panel{padding:12px 18px 14px}.panel h1{font-size:26px}.panel p{font-size:13px;margin:4px 0 8px}#np{margin-bottom:10px}#np button{width:44px;height:44px;font-size:20px}#help{font-size:11.5px!important;margin-top:8px!important}.big{font-size:17px;padding:6px 26px;min-height:44px}#msg{font-size:30px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="ui">
  <button id="mute" aria-label="الصوت">♪</button>
  <div id="rot">أديري الهاتف أفقياً لتجربة أفضل</div>
  <div id="splash" class="panel"><h1>أنقذي القرية<span>من ملك التنانين</span></h1><p>مغامرة خيالية ثنائية الأبعاد — حتى ٤ لاعبين</p><button class="big" id="bStory">ابدئي القصة</button></div>
  <div id="cap"><p id="capT"></p><div class="row"><button id="bSkip" class="ghost">تخطي</button><span id="dots"></span><button id="bNext" class="big sm">التالي</button></div></div>
  <div id="title" class="panel"><h1>«أنقذي قريتك!»</h1><div id="tMain"><div class="lbl">عدد اللاعبين</div><div id="np"></div><button class="big" id="bStart">ابدئي المغامرة</button>
   <div id="tMulti" style="display:none"><button class="big" id="bHost">أنشئي غرفة برمز</button><div style="margin-top:10px"><button class="ghost" id="bLocal">أو العبوا على نفس الجهاز</button></div></div>
   <div style="margin-top:10px"><button class="ghost" id="bJoin">انضمي إلى غرفة برمز</button></div><p id="help"></p></div>
  <div id="tJoin" style="display:none"><div class="lbl">أدخلي رمز الغرفة</div><input id="code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="" aria-label="رمز الغرفة"><div><button class="big" id="bGo">انضمام</button></div><p id="jMsg"></p><button class="ghost" id="bBack1">رجوع</button></div>
  <div id="tLobby" style="display:none"><div class="lbl" id="lTitle">رمز الغرفة</div><div id="lCode"></div><p id="lMsg"></p><button class="big" id="bPlay">ابدئي الآن</button><div style="margin-top:10px"><button class="ghost" id="bBack2">خروج من الغرفة</button></div></div></div>
  <div id="msg"></div>
  <div id="hint"></div>
  <div id="lose" class="panel"><h2 id="loseT"></h2><button class="big" id="bRetry">أعيدي المحاولة</button></div>
  <div id="final" class="panel" style="top:27%"><h1>النهاية السعيدة</h1><p>«بشجاعتكِ، عاد السلام إلى القرية!»</p><button class="big" id="bAgain">العبي من جديد</button></div>
  <div id="pads"></div>
  <div id="kh"></div>
</div>

addEventListener('keyup',e=>{keys[e.code]=0;});
const ptr={};function zone(x){return NET.on?Math.max(0,NET.me):clamp(Math.floor(x/W*NP),0,NP-1);}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();try{cv.focus({preventScroll:true});}catch(_){}try{cv.setPointerCapture(e.pointerId);}catch(_){}const i=zone(e.clientX);ptr[e.pointerId]={x:e.clientX,y:e.clientY,ly:e.clientY,i};if(ST.name==='sky')attack(pl[i]);else if(ST.name==='summit')anyTap();});
cv.addEventListener('pointermove',e=>{const q=ptr[e.pointerId];if(!q)return;const p=pl[q.i];if(!p)return;
if(ST.name==='sky'){p.fy=clamp(p.fy+(e.clientY-q.ly)/S,VH*.14,VH*.88);q.ly=e.clientY;}
else if(ST.name==='l1'){const dx=e.clientX-q.x,dy=e.clientY-q.y,th=24;if(Math.abs(dx)>th&&Math.abs(dx)>=Math.abs(dy)){p.dir=dx>0?1:-1;p.kb=0;q.x=e.clientX;q.y=e.clientY;}else if(dy<-th){jump(p);q.x=e.clientX;q.y=e.clientY;}else if(dy>th*1.6){p.dir=0;q.x=e.clientX;q.y=e.clientY;}}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{delete ptr[e.pointerId];}));
document.addEventListener('contextmenu',e=>e.preventDefault());
function btn(id,fn){$(id).addEventListener('click',e=>{audioInit();sfx.click();fn(e);});}
btn('bStory',()=>go('intro',0));btn('bSkip',()=>{if(ST.name==='intro')go('title');else go('final');});$('bNext').addEventListener('click',()=>{audioInit();nextScene();});
btn('bStart',()=>{NP=1;go('l1');});btn('bLocal',()=>go('l1'));btn('bHost',hostRoom);btn('bJoin',()=>{tView('tJoin');$('jMsg').textContent='';});btn('bGo',joinRoom);btn('bBack1',()=>{leaveRoom();});btn('bBack2',()=>{leaveRoom();});btn('bPlay',()=>{if(NET.count<2)return;NP=NET.count;go('l1');});btn('bRetry',()=>{show('lose',0);if(ST.retry==='boss')go('sky',true);else go('l1');});btn('bAgain',()=>go('title'));
btn('mute',()=>{muted=!muted;$('mute').classList.toggle('off',muted);if(MG)MG.gain.value=muted?0:.6;});
for(let i=1;i<=4;i++){const b=document.createElement('button');b.textContent=String(i);if(i===1)b.className='on';b.addEventListener('click',()=>{NP=i;audioInit();sfx.click();[...$('np').children].forEach((c,k)=>c.classList.toggle('on',k===i-1));$('bStart').style.display=i===1?'':'none';$('tMulti').style.display=i===1?'none':'block';});$('np').appendChild(b);}
$('help').innerHTML=TOUCH?'اسحبي يميناً ويساراً للركض، وللأعلى للقفز (أو زر «قفز»).<br>في المعركة: اضغطي بسرعة للهجوم واسحبي لتفادي النار.<br>للعب مع صديقاتك: اختاري العدد ثم «أنشئي غرفة برمز»، وكل لاعبة تنضم من جهازها بالرمز.':'الأسهم (أو A/D) للركض، و Space للقفز. في المعركة: أعلى/أسفل للطيران و Space للهجوم.<br>للعب مع صديقاتك: اختاري العدد ثم «أنشئي غرفة برمز»، وكل لاعبة تنضم من جهازها بالرمز.';

/* ---------- loop ---------- */
function update(dt){T+=dt;ST.t+=dt;shk=Math.max(0,shk-dt*34);flash=Math.max(0,flash-dt*1.6);if(hintT>0){hintT-=dt;if(hintT<=0)show('hint',0);}
if(fadeDir===1){fade+=dt*2.4;if(fade>=1){fade=1;fadeCb();fadeDir=-1;}}else if(fadeDir===-1){fade-=dt*2.4;if(fade<=0){fade=0;fadeDir=0;}}
netTick(dt);const s=ST.name;if(s==='l1')l1Update(dt);else if(s==='summit')summitUpdate(dt);else if(s==='sky')skyUpdate(dt);updParts(dt);}
function render(){g.setTransform(DPR*S,0,0,DPR*S,0,0);const s=ST.name;g.save();
const story=s==='intro'||s==='outro'||s==='final'||s==='splash'||s==='title',kz=story?1+.035*ease(ST.t/9):1+shk*.004;
g.translate(VW/2+(shk?rnd(-shk,shk):0),VH/2+(shk?rnd(-shk,shk):0));g.scale(kz,kz);g.translate(-VW/2,-VH/2);
if(s==='splash'){villageScene({m:1,lit:0});const x=VW*.5+Math.sin(T*.5)*VW*.3,y=VH*.2+Math.sin(T)*20,f=Math.cos(T*.5)>0?1:-1;unicorn(x,y,.9,{t:T,face:f,rider:{c:0,mood:'happy'}});}
else if(s==='intro')INTRO[ST.scene]();
else if(s==='title'){sceneSiege();g.fillStyle='rgba(16,8,36,.45)';g.fillRect(-40,-40,VW+80,VH+80);}
else if(s==='l1'||s==='summit')drawL1();
else if(s==='sky')drawSky();
else OUTRO[ST.scene]();
g.restore();
if(story&&s!=='splash'&&s!=='title'){const v=g.createRadialGradient(VW/2,VH/2,VH*.4,VW/2,VH/2,VW*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(10,4,30,.5)');g.fillStyle=v;g.fillRect(0,0,VW,VH);}
if(flash>0){g.fillStyle='rgba(255,255,255,'+flash+')';g.fillRect(0,0,VW,VH);}
if(fade>0){g.fillStyle='rgba(12,6,28,'+fade+')';g.fillRect(0,0,VW,VH);}}
let last=0;function frame(ts){const dt=Math.min((ts-last)/1000||0,1/30);last=ts;try{update(dt);render();}catch(err){console.error(err);}requestAnimationFrame(frame);}
enter('splash');requestAnimationFrame(frame);
window.G={NET,ST,pl,B,L,enter,go,keys,set np(v){NP=v;},jump,attack,get D(){return D;}};
</script>
